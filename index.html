<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enral Ocrain</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0b0d1a}
body{background:radial-gradient(circle at 20% 0,#1e1b4b 0,#0b0d1a 45%);color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
.cell{transition:.15s}.cell:not(:disabled):hover{transform:scale(1.07)}
.pop{animation:pop .35s ease}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.glow{box-shadow:0 0 30px rgba(99,102,241,.35)}
</style></head>
<body>
<div id="app" class="max-w-5xl mx-auto px-3 pb-10"></div>
<div id="m" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[60] hidden bg-slate-800 border border-indigo-500/50 px-4 py-2 rounded-xl text-sm"></div>
<script>
const R1="Learn 10 English Words (with Details & Sentence Use)",R2="Read 1 Manga Chapter",R3="Read 1 Novel Chapter";
const BASE=["See 5 Minutes Anime","See 10 Minutes Anime","See 15 Minutes Anime","Watch 1 Full Episode","Samoli Treat","Chingum (Chewing Gum)","10 Minutes Reels","Watch 1 Reel","Watch 3 Reels","Watch 5 Reels","Watch 10 Reels","Play 1 Game Online","Play 2 Games Online","Play 3 Games Online","Play 5 Games Online","Listen Song 1","Listen Song 2","Listen Song 3","Listen Song 4","Write a Story on Your Own","Meditation Session","10 Minutes Exercise","Drink a Glass of Water & Stretch","5 Minutes Power Nap","Tea / Coffee Break"];
const CATS=["Custom Treat","Entertainment","Study & Skill","Health & Mind"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let user=null,S=null,page=0,hl=0,busy=false,tick=null,authMode='login';
const rand=a=>a[Math.floor(Math.random()*a.length)];
const pool=()=>BASE.concat(S.custom.map(c=>c.title));
function reward(n){if(n%10==0)return R1;if(n%50==25)return R2;if(n%50==45)return R3;
 const r=n-Math.floor(n/10)-Math.floor((n+25)/50)-Math.floor((n+5)/50),p=pool();return p[(r-1)%p.length]}
const locked=()=>S&&S.lock&&S.lock.until>Date.now();
const save=()=>ls.set('mv_d_'+user,S);
const dur=s=>s>=3600?(s/3600)+' Hour':s>=60?(s/60)+' Min':s+' Sec';
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function fmt(ts){const d=new Date(ts);return{day:d.toLocaleDateString('en-US',{weekday:'long'}),date:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),time:d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),2200)}
function openM(h){const m=$('m');m.innerHTML='<div class="pop bg-slate-900 border border-indigo-500/40 rounded-2xl w-full max-w-md max-h-[85vh] overflow-y-auto p-5">'+h+'</div>';m.classList.remove('hidden');m.classList.add('flex');m.onclick=e=>{if(e.target===m)closeM()}}
function closeM(){const m=$('m');m.classList.add('hidden');m.classList.remove('flex')}
function ask(msg,okLabel,fn){openM('<h3 class="text-lg font-bold mb-2">Please confirm</h3><p class="text-slate-300 text-sm mb-5">'+msg+'</p><div class="flex gap-2 justify-end"><button class="px-4 py-2 rounded-lg bg-slate-700" onclick="closeM()">Cancel</button><button id="ok" class="px-4 py-2 rounded-lg bg-rose-600 font-semibold">'+okLabel+'</button></div>');$('ok').onclick=()=>{closeM();fn()}}

/* ---------- AUTH ---------- */
async function hash(p,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return sha256(salt+p)}}
function sha256(m){
 const rr=(x,n)=>(x>>>n)|(x<<(32-n));
 const K=[],H=[];let c=0;
 for(let p=2;c<64;p++){let q=1;for(let d=2;d*d<=p;d++)if(p%d==0){q=0;break}
  if(q){if(c<8)H[c]=Math.floor((Math.sqrt(p)%1)*4294967296);K[c]=Math.floor((Math.cbrt(p)%1)*4294967296);c++}}
 const b=Array.from(unescape(encodeURIComponent(m)),ch=>ch.charCodeAt(0)),l=b.length*8;
 b.push(128);while(b.length%64!=56)b.push(0);
 for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
 for(let o=0;o<b.length;o+=64){
  const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(let i=16;i<64;i++){const a=w[i-15],d=w[i-2];w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(d,17)^rr(d,19)^(d>>>10)))|0}
  let A=H[0],B=H[1],C=H[2],D=H[3],E=H[4],F=H[5],G=H[6],Hh=H[7];
  for(let i=0;i<64;i++){
   const t1=(Hh+(rr(E,6)^rr(E,11)^rr(E,25))+((E&F)^(~E&G))+K[i]+w[i])|0;
   const t2=((rr(A,2)^rr(A,13)^rr(A,22))+((A&B)^(A&C)^(B&C)))|0;
   Hh=G;G=F;F=E;E=(D+t1)|0;D=C;C=B;B=A;A=(t1+t2)|0}
  H[0]=(H[0]+A)|0;H[1]=(H[1]+B)|0;H[2]=(H[2]+C)|0;H[3]=(H[3]+D)|0;H[4]=(H[4]+E)|0;H[5]=(H[5]+F)|0;H[6]=(H[6]+G)|0;H[7]=(H[7]+Hh)|0}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
function authView(){
 const reg=authMode=='register';
 $('app').innerHTML='<div class="min-h-screen flex items-center justify-center"><div class="w-full max-w-sm bg-slate-900/80 border border-indigo-500/40 rounded-2xl p-6 glow">'+
 '<h1 class="text-2xl font-extrabold text-center bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">Enral Ocrain</h1>'+
 '<p class="text-center text-xs text-slate-400 mb-5">Quraa-Andazi &amp; Smart Watch-Time Reward System</p>'+
 '<input id="em" type="email" placeholder="Email" class="w-full mb-3 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 outline-none focus:border-indigo-400">'+
 '<input id="pw" type="password" placeholder="Password (min 6 characters)" class="w-full mb-3 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 outline-none focus:border-indigo-400">'+
 '<p id="err" class="text-rose-400 text-sm min-h-[1.25rem]"></p>'+
 '<button id="go" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold">'+(reg?'Create Account':'Login')+'</button>'+
 '<button id="sw" class="w-full mt-3 text-sm text-indigo-300">'+(reg?'Already have an account? Login':'New here? Create account')+'</button>'+
 '<button id="rs" class="w-full mt-2 text-sm text-emerald-300">Restore from backup</button>'+
 '<p class="text-[11px] text-slate-500 mt-4 text-center">Your data is saved on this device under your email. No server is involved, so clearing browser data removes it.</p></div></div>';
 $('sw').onclick=()=>{authMode=reg?'login':'register';authView()};
 $('rs').onclick=()=>restoreM();
 $('go').onclick=async()=>{
  const e=$('em').value.trim().toLowerCase(),p=$('pw').value,err=$('err'),users=ls.get('mv_users')||{};
  if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent='Enter a valid email.';return}
  if(p.length<6){err.textContent='Password must be at least 6 characters.';return}
  if(reg){if(users[e]){err.textContent='Account already exists. Please login.';return}
   const salt=Math.random().toString(36).slice(2);users[e]={salt,h:await hash(p,salt)};ls.set('mv_users',users)}
  else{const u=users[e];if(!u||u.h!==await hash(p,u.salt)){err.textContent='Wrong email or password.';return}}
  startSession(e,true)}
}
function startSession(e,isNew){
 user=e;S=ls.get('mv_d_'+e)||{claimed:{},custom:[],lock:null,sessions:[]};
 S.sessions=S.sessions||[];
 S.log=S.log||Object.entries(S.claimed).map(([n,r])=>Object.assign({n:+n},r));
 if(isNew)S.sessions.push(Date.now());
 save();ls.set('mv_session',e);appView()}
function logout(){ls.set('mv_session',null);user=null;S=null;clearInterval(tick);authView()}

/* ---------- APP ---------- */
function appView(){
 $('app').innerHTML=
 '<div id="banner" class="sticky z-40 hidden mb-3" style="top:env(safe-area-inset-top,0px)"></div>'+
 '<header class="flex items-center justify-between py-4 gap-2"><div><h1 class="text-xl sm:text-2xl font-extrabold bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">Enral Ocrain</h1><p class="text-[11px] text-slate-400 truncate max-w-[200px]">'+esc(user)+'</p></div>'+
 '<div class="flex flex-wrap justify-end gap-2 text-sm"><button onclick="backupM()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">💾 Backup</button><button onclick="histM()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">📜 My History</button><button onclick="logout()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">Logout</button></div></header>'+
 '<section class="rounded-2xl border border-indigo-500/40 bg-slate-900/70 p-5 text-center glow mb-5">'+
 '<p class="text-xs uppercase tracking-widest text-slate-400">Quraa-Andazi · Lucky Draw</p>'+
 '<div class="my-4 mx-auto max-w-sm rounded-xl bg-black border-2 border-indigo-500/60 py-4 px-3"><div id="slot" class="font-mono text-5xl font-black text-emerald-400 tracking-widest">#----</div><div id="slotr" class="text-xs text-slate-300 mt-2 h-4 truncate">Press draw to spin</div></div>'+
 '<button id="drawBtn" onclick="draw()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-fuchsia-600 font-bold text-lg disabled:opacity-40 disabled:cursor-not-allowed">🎰 Quraa-Andazi Karein (Draw Number)</button>'+
 '<div class="flex flex-wrap justify-center gap-2 mt-4 text-sm"><button onclick="customM()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">➕ Add Custom Reward</button><button onclick="resetAsk()" class="px-3 py-2 rounded-lg bg-slate-800 border border-rose-500/50 text-rose-300">Reset History</button></div>'+
 '<p id="stat" class="text-xs text-slate-400 mt-3"></p></section>'+
 '<section><div class="flex gap-2 items-center mb-3"><input id="sq" type="number" min="1" max="1200" placeholder="Search number (1-1200)" class="flex-1 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 outline-none focus:border-indigo-400" oninput="search(this.value)"></div>'+
 '<div id="tabs" class="flex gap-2 overflow-x-auto pb-2 mb-3"></div>'+
 '<div class="flex flex-wrap gap-3 text-[11px] text-slate-400 mb-2"><span>🟣 Undrawn</span><span>✅ Won</span><span>🔒 Locked</span></div>'+
 '<div id="grid" class="grid grid-cols-5 sm:grid-cols-10 gap-1.5"></div></section>';
 renderAll();clearInterval(tick);tick=setInterval(tickFn,500);tickFn()}
function renderAll(){renderTabs();renderGrid();renderStat();tickFn()}
function renderStat(){const c=Object.keys(S.claimed).length;$('stat').textContent='Total draws '+S.log.length+' · Different numbers won '+c+' · All 1200 always in play · Custom rewards '+S.custom.length}
function renderTabs(){let h='';for(let i=0;i<12;i++)h+='<button onclick="page='+i+';hl=0;renderTabs();renderGrid()" class="shrink-0 px-3 py-1.5 rounded-lg text-xs border '+(i==page?'bg-indigo-600 border-indigo-400':'bg-slate-800 border-slate-700')+'">'+(i*100+1)+'-'+(i*100+100)+'</button>';$('tabs').innerHTML=h}
function renderGrid(){
 const lk=locked(),cnt={};S.log.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);let h='';
 for(let n=page*100+1;n<=page*100+100;n++){
  const w=S.claimed[n];let cls,lab=n;
  if(w){cls='bg-emerald-600/25 border-emerald-400 text-emerald-300'+(lk?' opacity-60':'');lab='✓ '+n+(cnt[n]>1?' ×'+cnt[n]:'')}
  else if(lk){cls='bg-slate-800/40 border-slate-700 text-slate-500 opacity-50';lab='🔒'+n}
  else cls='bg-indigo-950/60 border-indigo-500 text-indigo-200';
  if(n==hl)cls+=' ring-2 ring-amber-400';
  h+='<button class="cell rounded-lg border py-2 text-xs sm:text-sm font-semibold '+cls+'" '+(lk?'disabled':'')+' onclick="clickNum('+n+')">'+lab+'</button>'}
 $('grid').innerHTML=h}
function search(v){const n=parseInt(v);if(n>=1&&n<=1200){page=Math.floor((n-1)/100);hl=n}else hl=0;renderTabs();renderGrid()}
function tickFn(){
 const b=$('banner'),d=$('drawBtn');if(!b)return;
 if(locked()){
  const left=(S.lock.until-Date.now())/1000,pct=Math.max(0,left/S.lock.total*100);
  b.classList.remove('hidden');
  b.innerHTML='<div class="rounded-xl border border-amber-400/60 bg-slate-900/95 backdrop-blur p-3"><div class="flex items-center justify-between gap-2"><div><div class="text-[11px] uppercase text-amber-300">⏳ Pending Watch-Time</div><div class="text-xs text-slate-300">Assigned: '+dur(S.lock.total)+'</div></div><span class="text-[11px] px-2 py-1 rounded-full '+(S.lock.rare?'bg-fuchsia-600':'bg-emerald-700')+'">'+(S.lock.rare?'Rare Draw · 20%':'Common Draw · 80%')+'</span><div class="font-mono text-2xl font-bold text-amber-300">'+mmss(Math.ceil(left))+'</div></div><div class="h-2 mt-2 rounded bg-slate-700 overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-400 to-rose-500" style="width:'+pct+'%"></div></div></div>';
  d.disabled=true;
 }else{
  if(!b.classList.contains('hidden')){b.classList.add('hidden');if(S.lock){S.lock=null;save();renderGrid();toast('✅ Watch time done — you can draw again!')}}
  d.disabled=busy}
}
function newLock(){const rare=Math.random()<.2,t=rand(rare?[30,600,1800,3600]:[60,120,180,300]);return{until:Date.now()+t*1000,total:t,rare}}
function claim(n){
 S.lock=newLock();
 const rec={title:reward(n),sec:S.lock.total,ts:Date.now(),rare:S.lock.rare};S.claimed[n]=rec;S.log.push(Object.assign({n},rec));
 save();renderAll();return S.claimed[n]}
function clickNum(n){

 if(locked())return toast('🔒 Locked until the timer ends');
 if(busy)return;
 const r=claim(n);rewardM(n,r,true)}
function rewardM(n,r,fresh){
 const t=fmt(r.ts);
 openM('<div class="text-center"><div class="text-5xl '+(fresh?'animate-bounce':'')+'">'+(fresh?'🎉':'✅')+'</div><p class="text-xs uppercase tracking-widest text-slate-400 mt-2">'+(fresh?'You won number':'Claimed number')+'</p><div class="font-mono text-4xl font-black text-emerald-400">#'+n+'</div><div class="my-4 p-3 rounded-xl bg-indigo-950 border border-indigo-500 font-semibold">'+esc(r.title)+'</div><p class="text-sm text-slate-300">Watch time: <b>'+dur(r.sec)+'</b></p><p class="text-xs text-slate-500 mt-1">'+t.day+', '+t.date+' · '+t.time+'</p><button class="mt-5 px-6 py-2 rounded-lg bg-indigo-600 font-semibold" onclick="closeM()">Awesome</button></div>')}
function draw(){
 if(locked()||busy)return;
 const av=[];for(let i=1;i<=1200;i++)av.push(i);

 busy=true;$('drawBtn').disabled=true;
 const win=rand(av);let t=0;
 const iv=setInterval(()=>{
  const n=t<30?rand(av):win;
  $('slot').textContent='#'+n;$('slotr').textContent=reward(n);
  if(++t>=31){clearInterval(iv);busy=false;page=Math.floor((win-1)/100);hl=win;const r=claim(win);setTimeout(()=>rewardM(win,r,true),350)}
 },65)}

/* ---------- CUSTOM REWARDS ---------- */
function customM(){
 let list=S.custom.map(c=>'<div class="flex items-center justify-between gap-2 py-2 border-b border-slate-800 text-sm"><div class="min-w-0"><div class="truncate">'+esc(c.title)+'</div><div class="text-[11px] text-slate-500">'+esc(c.cat)+'</div></div><button class="text-rose-400 shrink-0" onclick="delCustom('+c.id+')">Delete</button></div>').join('')||'<p class="text-sm text-slate-500 py-2">No custom rewards yet.</p>';
 openM('<h3 class="text-lg font-bold mb-3">Add Custom Reward</h3><input id="ct" maxlength="60" placeholder="Reward title" class="w-full mb-2 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 outline-none"><select id="cc" class="w-full mb-3 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select><button class="w-full py-2 rounded-lg bg-indigo-600 font-semibold" onclick="addCustom()">Add to Pool</button><h4 class="mt-5 mb-1 text-sm font-semibold text-slate-300">Your custom rewards</h4>'+list+'<button class="mt-4 w-full py-2 rounded-lg bg-slate-700" onclick="closeM()">Close</button>')}
function addCustom(){const t=$('ct').value.trim();if(!t)return toast('Enter a title');S.custom.push({id:Date.now(),title:t.slice(0,60),cat:$('cc').value});save();renderAll();customM();toast('Reward added to the pool')}
function delCustom(id){S.custom=S.custom.filter(c=>c.id!=id);save();renderAll();customM()}

/* ---------- HISTORY / RESET ---------- */
function histM(){
 const rows=S.log.slice().reverse().map(r=>{const n=r.n,t=fmt(r.ts);return'<div class="py-2 border-b border-slate-800 text-sm"><div class="flex justify-between gap-2"><b class="text-emerald-400">#'+n+'</b><span class="text-slate-400 text-xs">'+dur(r.sec)+'</span></div><div>'+esc(r.title)+'</div><div class="text-[11px] text-slate-500">'+t.day+' · '+t.date+' · '+t.time+'</div></div>'}).join('')||'<p class="text-sm text-slate-500">No numbers won yet.</p>';
 const ses=S.sessions.slice().reverse().map(ts=>{const t=fmt(ts);return'<div class="py-1.5 border-b border-slate-800 text-xs text-slate-300">'+t.day+' · '+t.date+' · '+t.time+'</div>'}).join('');
 openM('<h3 class="text-lg font-bold">My History</h3><p class="text-xs text-slate-500 mb-2">'+esc(user)+'</p><h4 class="text-sm font-semibold text-indigo-300 mt-2">All draws ('+S.log.length+')</h4>'+rows+'<h4 class="text-sm font-semibold text-indigo-300 mt-4">Login sessions</h4>'+ses+'<button class="mt-4 w-full py-2 rounded-lg bg-slate-700" onclick="closeM()">Close</button>')}
function resetAsk(){ask('This clears all drawn numbers, history and any active timer. Your custom rewards and login sessions are kept.','Reset',()=>{S.claimed={};S.log=[];S.lock=null;save();page=0;hl=0;renderAll();toast('History reset')})}

/* ---------- BACKUP / RESTORE ---------- */
function backupM(){
 const users=ls.get('mv_users')||{};
 const json=JSON.stringify({v:1,email:user,user:users[user],data:S});
 openM('<h3 class="text-lg font-bold mb-1">Backup</h3><p class="text-xs text-slate-400 mb-2">Copy this text and keep it safe (Notes, WhatsApp to yourself, etc). It contains your account and all progress.</p><textarea id="bk" readonly rows="7" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-[11px] font-mono">'+esc(json)+'</textarea><div class="flex gap-2 mt-3"><button class="flex-1 py-2 rounded-lg bg-indigo-600 font-semibold" onclick="copyBk()">Copy Backup</button><button class="flex-1 py-2 rounded-lg bg-slate-700" onclick="restoreM()">Restore</button></div><button class="mt-3 w-full py-2 rounded-lg bg-slate-800" onclick="closeM()">Close</button>')}
function copyBk(){const t=$('bk');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Backup copied'),()=>toast('Select the text and copy it manually'));
 else toast(ok?'Backup copied':'Select the text and copy it manually')}
function restoreM(){
 openM('<h3 class="text-lg font-bold mb-1">Restore from backup</h3><p class="text-xs text-slate-400 mb-2">Paste your backup text. If this email already exists here, its saved data will be replaced.</p><textarea id="rt" rows="7" placeholder="Paste backup here" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-[11px] font-mono"></textarea><p id="re" class="text-rose-400 text-sm min-h-[1.25rem]"></p><div class="flex gap-2"><button class="flex-1 py-2 rounded-lg bg-emerald-600 font-semibold" onclick="doRestore()">Restore</button><button class="flex-1 py-2 rounded-lg bg-slate-700" onclick="closeM()">Cancel</button></div>')}
function doRestore(){
 try{const o=JSON.parse($('rt').value.trim());
  if(!o||typeof o.email!=='string'||!o.user||!o.user.h||!o.data||typeof o.data.claimed!=='object')throw 0;
  const users=ls.get('mv_users')||{};users[o.email]=o.user;ls.set('mv_users',users);
  ls.set('mv_d_'+o.email,o.data);closeM();startSession(o.email,false);toast('Backup restored')
 }catch(e){$('re').textContent='Invalid backup text. Paste the full text you copied.'}}

/* ---------- BOOT ---------- */
const sess=ls.get('mv_session'),users0=ls.get('mv_users')||{};
if(sess&&users0[sess])startSession(sess,false);else authView();
</script></body></html>
