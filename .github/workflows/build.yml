name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          APP_URL="https://$OWNER.github.io/$REPO/"
          echo "App URL: $APP_URL"
          mkdir -p app/src/main/java/com/enral/ocrain app/src/main/res/mipmap-xxxhdpi
          SRC=""
          for f in icon.png icon.jpg icon.jpeg; do if [ -f "$f" ]; then SRC="$f"; break; fi; done
          IM=convert
          if command -v magick >/dev/null 2>&1; then IM=magick; fi
          OUT=app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          if [ -n "$SRC" ]; then
            $IM "$SRC[0]" -resize 192x192^ -gravity center -extent 192x192 PNG32:$OUT
          else
            $IM -size 192x192 xc:'#4f46e5' PNG32:$OUT
          fi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "EnralOcrain"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.enral.ocrain'
            compileSdk 34
            defaultConfig { applicationId 'com.enral.ocrain'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:icon="@mipmap/ic_launcher" android:label="Enral Ocrain" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/enral/ocrain/MainActivity.java <<'EOF'
          package com.enral.ocrain;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            WebView w;
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.setWebChromeClient(new WebChromeClient());
              w.loadUrl("APP_URL_HERE");
            }
            public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }
          EOF
          sed -i "s|APP_URL_HERE|$APP_URL|" app/src/main/java/com/enral/ocrain/MainActivity.java
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EnralOcrain-APK
          path: app/build/outputs/apk/debug/app-debug.apk
